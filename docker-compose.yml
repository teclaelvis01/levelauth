# Desarrollo local con hot reload (API + Vite HMR) detrás de Traefik.
# Requiere: traefik en red levelcross-dev (calificador_tribus_v2/traefik).
# Uso: docker compose up --build
#
# Auth (Google OAuth solo acepta localhost en dev): http://localhost

services:
  mysql:
    image: mysql:8.4
    container_name: authlevel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: authlevel
      MYSQL_USER: authlevel
      MYSQL_PASSWORD: authlevel
    ports:
      - "3307:3306"
    volumes:
      - authlevel_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - levelcross-dev

  auth:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: authlevel-auth:dev
    container_name: authlevel-dev
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      CI: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: authlevel
      DB_USERNAME: authlevel
      DB_PASSWORD: authlevel
      APP_URL: ${APP_URL:-http://localhost}
      PORT: "3100"
      WEB_DEV_URL: ${WEB_DEV_URL:-http://localhost}
      VITE_DEV_HOST: localhost
      API_PROXY_TARGET: http://127.0.0.1:3100
      CHOKIDAR_USEPOLLING: "true"
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_OPEN_SETUP: "true"
      ALLOW_DEV_LOGIN: "true"
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_FALLBACK_LOCAL: ${STORAGE_FALLBACK_LOCAL:-true}
      R2_KEY_PREFIX: ${R2_KEY_PREFIX:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      UPLOADS_DIR: /app/server/uploads
    volumes:
      - ./:/app
      - authlevel_dev_node_modules:/app/node_modules
      - authlevel_dev_server_nm:/app/server/node_modules
      - authlevel_dev_web_nm:/app/web/node_modules
      - authlevel_uploads:/app/server/uploads
    networks:
      levelcross-dev:
        aliases:
          - levelauth
    labels:
      - traefik.enable=true
      - traefik.http.routers.levelauth-api.rule=Host(`localhost`) && (PathPrefix(`/api`) || PathPrefix(`/oauth`) || PathPrefix(`/uploads`) || PathPrefix(`/ws`) || Path(`/health`))
      - traefik.http.routers.levelauth-api.entrypoints=web
      - traefik.http.routers.levelauth-api.priority=100
      - traefik.http.routers.levelauth-api.service=levelauth-api
      - traefik.http.services.levelauth-api.loadbalancer.server.port=3100
      - traefik.http.routers.levelauth-web.rule=Host(`localhost`)
      - traefik.http.routers.levelauth-web.entrypoints=web
      - traefik.http.routers.levelauth-web.priority=1
      - traefik.http.routers.levelauth-web.service=levelauth-web
      - traefik.http.services.levelauth-web.loadbalancer.server.port=5173

networks:
  levelcross-dev:
    external: true

volumes:
  authlevel_mysql_data:
  authlevel_uploads:
  authlevel_dev_node_modules:
  authlevel_dev_server_nm:
  authlevel_dev_web_nm:
