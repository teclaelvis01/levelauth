# Stack local “built” (imagen de producción). Sin hot reload.
# Para desarrollo con HMR: docker compose -f docker-compose.dev.yml up --build
#   → SPA en http://localhost:5173  ·  API en http://localhost:3100

services:
  mysql:
    image: mysql:8.4
    container_name: authlevel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: authlevel
      MYSQL_USER: authlevel
      MYSQL_PASSWORD: authlevel
    ports:
      - "3307:3306"
    volumes:
      - authlevel_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    image: authlevel-auth:prod
    container_name: authlevel-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: authlevel
      DB_USERNAME: authlevel
      DB_PASSWORD: authlevel
      APP_URL: ${APP_URL:-http://localhost:3100}
      PORT: "3100"
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_OPEN_SETUP: ${ALLOW_OPEN_SETUP:-true}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "3100:3100"
    volumes:
      - authlevel_uploads:/app/uploads

volumes:
  authlevel_mysql_data:
  authlevel_uploads:
