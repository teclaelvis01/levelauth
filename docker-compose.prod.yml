# Production — MySQL lo aporta Coolify (DB_* estilo Laravel).
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Subpath en Coolify (convive con https://levelcross.iglesiasalem.com/):
#   - Dominio / path: levelcross.iglesiasalem.com/auth
#   - Ports: 3100 (mismo que PORT abajo)
#   - Strip Prefix: /auth  (el contenedor escucha en /)
#   - BASE_PATH=/auth (build arg + runtime)
#   - APP_URL=https://levelcross.iglesiasalem.com/auth
#   - Google redirect: https://levelcross.iglesiasalem.com/auth/oauth/google/callback
#   - Red: coolify (external) — sin ella Traefik da 502
#   - Rolling updates: sin container_name ni Custom Container Name en Coolify
#   - Healthcheck: GET /health (puerto 3100)
#
# Subdominio futuro (auth.iglesiasalem.com o *.iglesiasalem.com):
#   - BASE_PATH=   (vacío)
#   - APP_URL=https://auth.iglesiasalem.com
#   - COOKIE_DOMAIN=.iglesiasalem.com

services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:-/auth}
    image: authlevel:prod
    restart: always
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      PORT: "3100"
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: ${DATABASE_URL:-}
      APP_URL: ${APP_URL}
      BASE_PATH: ${BASE_PATH:-/auth}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ALLOW_OPEN_SETUP: ${ALLOW_OPEN_SETUP:-false}
      WEB_DIST: /app/web/dist
      STORAGE_DRIVER: ${STORAGE_DRIVER:-r2}
      STORAGE_FALLBACK_LOCAL: ${STORAGE_FALLBACK_LOCAL:-true}
      R2_KEY_PREFIX: ${R2_KEY_PREFIX:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      UPLOADS_DIR: /app/server/uploads
    # Coolify/Traefik habla por la red Docker; no hace falta publicar al host.
    expose:
      - "3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      # Alineado con WORKDIR /app/server (cwd del proceso)
      - authlevel_uploads_prod:/app/server/uploads
    networks:
      coolify:
        aliases:
          - levelauth

volumes:
  authlevel_uploads_prod:

networks:
  # `name:` evita que Coolify (--project-name=<uuid>) renombre la red a
  # <uuid> y falle con "network … declared as external, but could not be found".
  coolify:
    name: coolify
    external: true
