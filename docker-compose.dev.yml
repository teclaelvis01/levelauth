# Desarrollo local con hot reload (API + Vite HMR).
# Uso: docker compose -f docker-compose.dev.yml up --build
#
# Frontend con HMR: http://localhost:5173
# API:                http://localhost:3100
# Tras login OAuth (callback en :3100) el server redirige la SPA a Vite.

services:
  mysql:
    image: mysql:8.4
    container_name: authlevel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: authlevel
      MYSQL_USER: authlevel
      MYSQL_PASSWORD: authlevel
    ports:
      - "3307:3306"
    volumes:
      - authlevel_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: authlevel-auth:dev
    container_name: authlevel-dev
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: authlevel
      DB_USERNAME: authlevel
      DB_PASSWORD: authlevel
      APP_URL: ${APP_URL:-http://localhost:3100}
      PORT: "3100"
      WEB_DEV_URL: http://localhost:5173
      CHOKIDAR_USEPOLLING: "true"
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_OPEN_SETUP: ${ALLOW_OPEN_SETUP:-true}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "3100:3100"
      - "5173:5173"
    volumes:
      - ./:/app
      - authlevel_dev_node_modules:/app/node_modules
      - authlevel_dev_server_nm:/app/server/node_modules
      - authlevel_dev_web_nm:/app/web/node_modules
      - authlevel_uploads:/app/server/uploads

volumes:
  authlevel_mysql_data:
  authlevel_uploads:
  authlevel_dev_node_modules:
  authlevel_dev_server_nm:
  authlevel_dev_web_nm:
